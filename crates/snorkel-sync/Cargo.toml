[package]
name = "snorkel-sync"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Checkpoint finality-follower and verified replica maintainer for the Rostro resolution sync spec (SYNC-SPEC.md). The quarantine zone: all chain-adjacent dependencies live here, never in snorkel-dns."

[[bin]]
name = "snorkel-sync"
path = "src/main.rs"

[dependencies]
snorkel-common = { path = "../snorkel-common" }
parity-scale-codec = { version = "3", features = ["derive"] }
blake2 = "0.10"
redb = "2"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
