[workspace]
resolver = "3"
# Vendored third-party crates: path dependencies, but not ours to lint or
# test. Their own KAT suites are run deliberately, not via --workspace.
exclude = ["external/slh-dsa", "external/substrate-trie"]
members = [
    "crates/snorkel-common",
    "crates/snorkel-dns",
    "crates/snorkel-janitor",
    "crates/snorkel-janitor-core",
    "crates/snorkel-sync",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_import_braces = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "warn"
integer_division = "warn"
float_arithmetic = "warn"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3
overflow-checks = false
debug = false
incremental = false
